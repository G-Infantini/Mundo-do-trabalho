name: Publicar TechConnect no GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'TechConnect/**'
      - '.github/workflows/techconnect-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: techconnect-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Enviar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: TechConnect
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
